name: Duroflexworld
description: >-
  Duroflex (duroflexworld.com) is one of India's most trusted sleep-solutions
  brands, selling mattresses, sofas, recliners, beds, pillows and mattress
  protectors direct-to-consumer with up to a 10-year warranty, free shipping and
  EMI options. The online store runs on Shopify and exposes real agent-facing
  commerce surfaces discovered by the API Evangelist enrichment pipeline: a hosted
  Storefront MCP server at /api/mcp (catalog search, cart, product details, and
  shop policy/FAQ tools that conform to the UCP catalog capability) and a Shopify
  Customer Account API secured with OAuth 2.0 / OpenID Connect, advertising an
  agent-oriented customer-account-mcp-api scope. Surfaced originally as a Norwest
  Venture Partners portfolio lead, the profile is now enriched with its MCP,
  well-known OIDC discovery, authentication, scopes and domain-security artifacts.
